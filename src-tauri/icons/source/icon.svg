<!--
  扒谱助手 · 应用图标母版（1024×1024）
  ============================================
  白底圆角方块 + 六边形 & 双八分音符（青 #6fe3ff → 紫 #a99cff 渐变）。
  照搬官网页头 .brand-mark 在 light 主题下的规格：
    白底 rgba(255,255,255,.94) + 极淡描边 rgba(30,70,150,.20) + 冷蓝微光
  几何与官网 logo 逐字一致（viewBox 32 坐标 → 整体缩放）。

  由 engine/tools/make_icons.py 消费，产出 src-tauri/icons/ 全套。
  同源文件（改一处就要一起看）：
    · icon-small.svg  —— 16/24/32px 用的放大加粗版（白底同上）
    · favicon.svg     —— 前端标签页图标（透明底，与官网 favicon 逐字一致）
    · ../../src/src/components/BrandMark.tsx —— 应用标题栏内的 logo
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 渐变方向与官网一致：objectBoundingBox 左上 → 右下 -->
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe3ff"/>
      <stop offset="1" stop-color="#a99cff"/>
    </linearGradient>
  </defs>

  <!-- 底板：白圆角方块 + 极淡内描边（对齐官网 .brand-mark 的 border） -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="#ffffff"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229.5" fill="none"
        stroke="#1e4696" stroke-opacity="0.10" stroke-width="6"/>

  <!-- 六边形 + 双八分音符（官网几何原样，scale 后居中） -->
  <g transform="translate(512 512) scale(19.5) translate(-16 -16)"
     stroke="url(#inkGrad)" stroke-width="2" stroke-linejoin="round" fill="none">
    <path d="M16 3l10.5 6.5v13L16 29 5.5 22.5v-13z"/>
    <path d="M13.2 20.2v-7.6l7-1.8v7.4" stroke-linecap="round"/>
  </g>
  <!-- 符头（实心圆，各取一端渐变之色） -->
  <g transform="translate(512 512) scale(19.5) translate(-16 -16)">
    <circle cx="11.4" cy="20.6" r="2" fill="#6fe3ff"/>
    <circle cx="18.4" cy="18.8" r="2" fill="#a99cff"/>
  </g>
</svg>
