<!--
  扒谱助手 · 应用图标小尺寸版（1024×1024 画布，供 16/24/32px 帧使用）
  ============================================
  与 icon.svg 同一形状、同一白底，只做光学尺寸调整：
    · 图案放大到约占 70%（大版约 53%）—— 小尺寸下多留的边只会白白吃掉像素
    · 线宽 2 → 2.5、符头 2 → 2.5 —— 否则 16px 时线只有 0.6px，糊成一团

  Windows 的任务栏/开始菜单常用 24–32px，所以这三档专门走这版；
  48px 起仍用 icon.svg 的精致版。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe3ff"/>
      <stop offset="1" stop-color="#a99cff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="#ffffff"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229.5" fill="none"
        stroke="#1e4696" stroke-opacity="0.10" stroke-width="6"/>

  <!-- 图案放大 + 加粗：小尺寸下的光学补偿 -->
  <g transform="translate(512 512) scale(25.5) translate(-16 -16)"
     stroke="url(#inkGrad)" stroke-width="2.5" stroke-linejoin="round" fill="none">
    <path d="M16 3l10.5 6.5v13L16 29 5.5 22.5v-13z"/>
    <path d="M13.2 20.2v-7.6l7-1.8v7.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(512 512) scale(25.5) translate(-16 -16)">
    <circle cx="11.4" cy="20.6" r="2.5" fill="#6fe3ff"/>
    <circle cx="18.4" cy="18.8" r="2.5" fill="#a99cff"/>
  </g>
</svg>
