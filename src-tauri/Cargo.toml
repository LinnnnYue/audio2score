[package]
name = "audio2score"
version = "0.1.3"
description = "音频自动扒谱桌面应用"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# lib 与 bin 同名，供 tauri 宏引用
[lib]
name = "audio2score_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

# 问题上报用的极简 HTTP 客户端。
# 刻意用 native-tls（Windows 走系统 SChannel）而非默认的 rustls：
# rustls 依赖 ring，而 ring 在 Windows 上编译需要 nasm + C 工具链，
# 会给「换台机器就能构建」这件事平添一个坑。native-tls 纯 FFI 系统 API，
# 且顺带省掉打包根证书的体积。
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
